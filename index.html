</style></head><body><button class="prism-demo" id="testChat" type="button">Load 100 test messages</button><div class="app collapsed" id="app"><div class="mobile-nav-backdrop" id="navBackdrop"></div><aside class="sidebar"><div class="brandrow"><span class="brand">✳ &nbsp;Trainer</span><button class="mini" id="collapse" title="Toggle sidebar">☰</button></div><button class="navbtn new" id="new"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg><span>New chat</span></button><button class="navbtn" id="projects"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v11H3zM3 7V5h8l2 2"/></svg><span>Projects</span></button><button class="navbtn" id="library"><svg viewBox="0 0 24 24"><path d="M3 5h8v15H3zM13 5h8v15h-8z"/></svg><span>Library</span></button><div class="section"><div class="section-title">Pinned</div><button class="navbtn" data-pinned="Research & Analysis"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v11H3z"/></svg><span>Research & Analysis</span></button><button class="navbtn" data-pinned="Knowledge Base"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 8h8M8 12h8"/></svg><span>Knowledge Base</span></button></div><div class="section recents"><div class="section-title">Recent conversations</div><div id="recentList"></div></div><div class="bottom"><button class="profile" id="profile"><span class="avatar">TR</span><span><span class="profile-name">Trainer Workspace</span><span class="profile-sub">Local prototype</span></span><span class="chevron">⌃</span></button><div class="popup" id="popup"><div class="popup-title">TRAINER · V20 GLASS</div><button id="theme">Toggle dark mode</button><button id="settings">Settings & information</button><button id="clear">Clear all local conversations</button></div></div></aside><main class="workspace"><header class="header"><span><button class="mobilemenu" id="mobilemenu">☰</button></span><span><strong id="topicName" style="display:none">Trainer</strong></span></header><section class="feed" id="feed" aria-live="polite"></section><div class="composer-wrap"><form class="composer" id="form"><div class="glass-motion" aria-hidden="true"><i class="light pink"></i><i class="light blue"></i><i class="light violet"></i></div><textarea id="input" rows="2" placeholder="Write something to begin..." aria-label="Write a message"></textarea><div class="composer-bottom"><span class="hint">Enter to send · Shift + Enter for new line</span><span class="thinking-status" id="thinkingToggle" aria-live="polite" style="font-size:12px;color:#999">Ready</span><button class="send" aria-label="Send" type="submit">↑</button></div></form></div></main><aside class="right" aria-label="Learning topics"><div class="right-head"><span class="right-brand">Learning paths</span><button class="mini" id="rightToggle" title="Collapse learning panel" aria-label="Toggle learning panel">⇥</button></div><div class="right-content"><div class="right-label">EXPLORE</div><div class="category-list" id="rail"><button class="category-row active" data-category="general"><span class="category-icon">◎</span><span class="category-text">General</span></button><button class="category-row" data-category="technology"><span class="category-icon">⌘</span><span class="category-text">Technology</span></button><button class="category-row" data-category="business"><span class="category-icon">▣</span><span class="category-text">Business</span></button><button class="category-row" data-category="creative"><span class="category-icon">✧</span><span class="category-text">Creative</span></button></div><div class="right-section"><div class="right-label">TOPICS</div><div id="options"></div></div></div><div class="right-footer"><span class="right-footer-mark">✳</span><span class="right-footer-text">Choose what to learn today</span></div></aside></div><script>
const $=id=>document.getElementById(id),topics={general:['General','Science','Mathematics','Language'],technology:['Programming','Web Development','Artificial Intelligence','Cybersecurity'],business:['Operations','Management','Marketing','Entrepreneurship'],creative:['UI / UX Design','Graphic Design','Writing','Product Design']};let category='general',topic='General',chats=[],current=null,demoOn=false;try{chats=JSON.parse(localStorage.getItem('trainer-v13-chats')||'[]')}catch{}if(!Array.isArray(chats))chats=[];function save(){localStorage.setItem('trainer-v13-chats',JSON.stringify(chats))}function active(){return chats.find(c=>c.id===current)}function newChat(){demoOn=false;$('testChat').textContent='Load 100 test messages';current=null;render();$('input').focus();$('app').classList.remove('mobile-open')}function render(){if(typeof demoOn!=='undefined'&&demoOn){showTestChat();return}let c=active(),feed=$('feed');feed.replaceChildren();if(!c||!c.messages.length){let w=document.createElement('div');w.className='welcome';w.innerHTML='<h1>What shall we learn today?</h1><p>Write a thought or question below.<br>Your learning workspace starts here.</p>';feed.append(w)}else c.messages.forEach(m=>{let el=document.createElement('div');el.className='bubble '+(typeof m==='string'||m.role==='user'?'user':'assistant');el.textContent=typeof m==='string'?m:m.text;feed.append(el)});feed.scrollTop=feed.scrollHeight;let list=$('recentList');list.replaceChildren();chats.slice().reverse().forEach(c=>{let b=document.createElement('button');b.className='recent'+(c.id===current?' active':'');b.textContent=c.title;b.title=c.title;b.onclick=()=>{current=c.id;render();$('app').classList.remove('mobile-open')};list.append(b)})}function renderTopics(){$('topicName').textContent=topic;$('options').replaceChildren();topics[category].forEach(t=>{let b=document.createElement('button');b.className='topicoption'+(topic===t?' selected':'');b.textContent=t;b.onclick=()=>{topic=t;renderTopics();$('input').focus()};$('options').append(b)})}document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;topic=topics[category][0];document.querySelectorAll('[data-category]').forEach(x=>x.classList.toggle('active',x===b));renderTopics()});$('form').onsubmit=e=>{e.preventDefault();let val=$('input').value.trim();if(!val||simulating)return;if(demoOn){demoOn=false;$('testChat').textContent='Load 100 test messages'}let c=active();if(!c){c={id:String(Date.now()),title:val.slice(0,38),messages:[],topic};chats.push(c);current=c.id}c.messages.push({role:'user',text:val});save();$('input').value='';$('input').style.height='auto';render();simulating=true;setThinking(true);$('input').disabled=true;const send=$('form').querySelector('.send');send.disabled=true;const feed=$('feed');const wait=document.createElement('div');wait.className='simulated-thinking';wait.innerHTML='<span>Trainer is thinking</span><span class="dots"><i></i><i></i><i></i></span>';feed.append(wait);feed.scrollTop=feed.scrollHeight;const chatId=c.id;window.setTimeout(()=>{const target=chats.find(x=>x.id===chatId);if(target){const reply=demoReply(val);target.messages.push({role:'assistant',text:reply});save()}simulating=false;setThinking(false);$('input').disabled=false;send.disabled=false;render();$('input').focus()},1900+Math.random()*1200)};$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}};$('input').oninput=()=>{$('input').style.height='auto';$('input').style.height=Math.min($('input').scrollHeight,160)+'px'};$('new').onclick=newChat;$('collapse').onclick=()=>{if(window.matchMedia('(max-width:700px)').matches){$('app').classList.toggle('mobile-open')}else{$('app').classList.toggle('collapsed')}};$('navBackdrop').onclick=()=>$('app').classList.remove('mobile-open');$('rightToggle').onclick=()=>{$('app').classList.toggle('right-collapsed');$('rightToggle').textContent=$('app').classList.contains('right-collapsed')?'⇤':'⇥'};$('mobilemenu').onclick=()=>$('app').classList.toggle('mobile-open');$('profile').onclick=()=>$('popup').classList.toggle('open');$('settings').onclick=()=>alert('Trainer v2.1 — UI prototype only. Chats are saved in this browser. No AI or server is connected.');$('clear').onclick=()=>{if(confirm('Delete all locally saved conversations?')){chats=[];current=null;save();render();$('popup').classList.remove('open')}};$('theme').onclick=()=>{alert('Dark mode is now the default Trainer appearance.');$('popup').classList.remove('open')};$('projects').onclick=()=>alert('Projects is reserved for a future update.');$('library').onclick=()=>alert('Library is reserved for a future update.');document.querySelectorAll('[data-pinned]').forEach(b=>b.onclick=()=>{topic=b.dataset.pinned;$('topicName').textContent=topic;$('input').focus()});renderTopics();render();
// 100-message sample chat is generated locally; it never touches saved chats.
const sampleQuestions=['What should we learn first?','Could you explain that in simpler terms?','How would this work in a real project?','What is a practical example?','What should I try next?'];
const sampleAnswers=['Start with a small idea and build on it one step at a time.','Think of the system as a collection of small parts working together.','A useful exercise is to sketch the workflow before writing any code.','Compare two approaches, then choose the simplest one that solves the problem.','Keep experimenting. The goal of this preview is to test the reading experience.'];
function showTestChat(){
 const feed=$('feed');feed.replaceChildren();
 for(let i=0;i<100;i++){
  const item=document.createElement('div');item.className='test-message '+(i%2===0?'test-user':'test-assistant');
  const label=document.createElement('span');label.className='test-label';label.textContent=i%2===0?'YOU':'TRAINER · SAMPLE';
  const content=document.createElement('div');content.textContent=i%2===0?sampleQuestions[Math.floor(i/2)%sampleQuestions.length]:sampleAnswers[Math.floor(i/2)%sampleAnswers.length];
  content.className='message-content';item.append(label,content);feed.append(item);
 }
 feed.scrollTop=0;
}
$('testChat').onclick=()=>{demoOn=!demoOn;$('testChat').textContent=demoOn?'Exit test chat':'Load 100 test messages';demoOn?showTestChat():render()};

// Local mock response engine. No API calls or actual AI inference.
let simulating=false;
function demoReply(message){const q=message.toLowerCase();if(/hello|hi|hey/.test(q))return 'Hello! I’m Trainer’s demo response. The thinking animation you just saw is simulated — no AI is connected yet.';if(/code|program|javascript|web|html/.test(q))return 'For a programming topic, we could start with a small working example, test it, and improve it step by step. This is a placeholder reply for interface testing.';if(/business|management|sales|work/.test(q))return 'A useful first step is to define the goal, the constraints, and one measurable outcome. This response is only a local demo.';return 'You asked: “'+message.slice(0,140)+'”\n\nThis is a simulated Trainer reply. We can later replace it with a real AI response without changing the chat interface.'}
// Visual-only thinking preview; no AI call or generated reply.
const thinkingButton=document.getElementById('thinkingToggle');
const composerElement=document.getElementById('form');
function setThinking(on){composerElement.classList.toggle('thinking',on);thinkingButton.setAttribute('aria-pressed',String(on));thinkingButton.innerHTML=on?'<span class="ai-thinking-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.5 14.5 9.5 21.5 12 14.5 14.5 12 21.5 9.5 14.5 2.5 12 9.5 9.5Z"/><path d="M19 2v4M17 4h4"/></svg></span><span>Thinking…</span>':'Ready'}


// Align expanded menu's bottom to the chat composer's top using the same outer gap.
(function(){
 const menu=document.querySelector('.sidebar');
 const composer=document.querySelector('.composer');
 function alignMenu(){
  if(window.innerWidth>700)return;
  const bounds=composer.getBoundingClientRect();
  const gap=18;
  const top=14;
  const bottom=Math.max(top+240,bounds.top-gap);
  document.documentElement.style.setProperty('--menu-top',top+'px');
  document.documentElement.style.setProperty('--menu-left',gap+'px');
  document.documentElement.style.setProperty('--menu-open-height',Math.max(220,bottom-top)+'px');
 }
 alignMenu();
 window.addEventListener('resize',alignMenu,{passive:true});
 if(typeof ResizeObserver!=='undefined')new ResizeObserver(alignMenu).observe(composer);
})();
</script></body></html>
